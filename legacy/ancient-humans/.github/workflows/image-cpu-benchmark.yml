name: Manual local CPU image benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        model: [dreamshaper, ssd1b]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      CPU_IMAGE_WIDTH: '768'
      CPU_IMAGE_HEIGHT: '432'
      CPU_IMAGE_STEPS: '28'
      CPU_IMAGE_GUIDANCE_SCALE: '7.5'
      CPU_IMAGE_BENCHMARK: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install local CPU image dependencies
        run: |
          pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cpu.txt
          pip install 'huggingface-hub>=0.34,<2'
      - name: Benchmark DreamShaper 8
        if: matrix.model == 'dreamshaper'
        run: python -u benchmark_images.py --output benchmark-output
      - name: Benchmark SSD-1B
        if: matrix.model == 'ssd1b'
        env:
          CPU_IMAGE_MODEL: segmind/SSD-1B
          CPU_IMAGE_WIDTH: '1024'
          CPU_IMAGE_HEIGHT: '576'
          CPU_IMAGE_STEPS: '16'
          CPU_IMAGE_GUIDANCE_SCALE: '7.0'
        run: python -u benchmark_images.py --output benchmark-output
      - name: Save measurements and sample images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-benchmark-${{ matrix.model }}
          path: benchmark-output/
          if-no-files-found: warn
