name: Preview Ancient Humans backgrounds and thumbnail
on:
  workflow_dispatch:
    inputs:
      asset:
        description: 'Render all samples or one requested asset'
        type: choice
        default: all
        options: [all, background-01, background-02, thumbnail]
permissions:
  contents: read
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(inputs.asset == 'thumbnail' && '["thumbnail"]' || inputs.asset == 'background-01' && '["background-01"]' || inputs.asset == 'background-02' && '["background-02"]' || '["background-01","background-02","thumbnail"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_BACKEND: cpu
      CPU_IMAGE_MODEL: segmind/SSD-1B
      CPU_IMAGE_WIDTH: '1024'
      CPU_IMAGE_HEIGHT: '576'
      CPU_IMAGE_STEPS: '16'
      CPU_IMAGE_GUIDANCE_SCALE: '9.0'
      CPU_STYLE_REFERENCE: ''
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install production CPU image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-cpu.txt
      - name: Generate and validate production sample
        run: python -u preview_human_history.py --asset ${{ matrix.asset }}
      - name: Save requested sample images and prompts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ancient-humans-${{ matrix.asset }}
          path: preview-human-history/
          if-no-files-found: error
          retention-days: 7
