name: Validate saved private video
on:
  push:
    branches: [main]
    paths: ['.github/workflows/saved-video-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Read saved Drive assets and strictly decode the complete original MP4
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SAVED_RUN_ID: 2026-10-13-free-private-test
        run: python -u free_private_test.py restore
# Read-only validation. No YouTube API call, no publishing, no generation.
