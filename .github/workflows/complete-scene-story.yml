name: Complete scene story episode and skipped Shorts
on:
  workflow_run:
    workflows: [Dudi Dam TV kids rhyme generation]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: dudi-dam-tv-publish
  cancel-in-progress: false
jobs:
  recover:
    if: format('{0}', github.event.workflow_run.id) == '41316394479' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SONG_RUN_ID: scene-story-41316394479
      SOURCE_RUN: '41316394479'
      UPLOAD_MODE: public
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCztvMrNCT34DO3DtzLPgWaw' }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate recovery identity
        shell: bash
        run: |
          [[ "$SONG_RUN_ID" =~ ^[a-zA-Z0-9_-]{1,80}$ ]] || exit 1
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: generated-music-41316394479
          run-id: '41316394479'
          github-token: ${{ github.token }}
          path: output/
      - uses: actions/download-artifact@v4
        with:
          pattern: generated-artwork-41316394479-*
          merge-multiple: true
          run-id: '41316394479'
          github-token: ${{ github.token }}
          path: output/
      - uses: actions/download-artifact@v4
        with:
          name: kids-video-41316394479
          run-id: '41316394479'
          github-token: ${{ github.token }}
          path: output/
      - uses: actions/download-artifact@v4
        with:
          name: music-output-41316394479
          run-id: '41316394479'
          github-token: ${{ github.token }}
          path: output/
      - name: Require intact finished render before publication
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from motion_video import render_is_current
          root=Path('output')/os.environ['SONG_RUN_ID']
          if not render_is_current(root):
              raise SystemExit('Recovery artifacts do not match the finished render; refusing regeneration')
          print('Finished video and original sources verified')
          PY
      - name: Resume backup and publication
        if: vars.PUBLISH_ENABLED == 'true'
        run: python -u pipeline.py --run-id "$SONG_RUN_ID" --defer-drive-cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-publication-${{ github.run_id }}
          path: output/*/*.json
          retention-days: 7
  shorts:
    name: Generate and publish the missing episode Short
    needs: recover
    uses: ./.github/workflows/shorts.yml
    with:
      source_run: '41316394479'
      run_id: scene-story-41316394479
      prepared_music: false
      prepared_portraits: false
      upload_mode: public
    secrets: inherit
  facebook:
    name: Optional Facebook episode publication
    needs: recover
    if: vars.FACEBOOK_PUBLISH_ENABLED == 'true' && vars.PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/facebook.yml
    with:
      source_run: '41316394479'
      run_id: scene-story-41316394479
      kind: video
      non_blocking: true
    secrets: inherit
  cleanup:
    name: Clean published media from Drive
    needs: [recover, shorts]
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONG_RUN_ID: scene-story-41316394479
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCztvMrNCT34DO3DtzLPgWaw' }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify public HD video and clean its temporary media
        run: python -u cleanup_drive.py --run-id "$SONG_RUN_ID"
