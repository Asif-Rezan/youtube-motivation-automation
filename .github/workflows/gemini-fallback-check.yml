name: Gemini fallback live check
on:
  push:
    branches: [main]
    paths: [workflow.py, gemini_fallback_check.py, .github/workflows/gemini-fallback-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Test fallback logic
        run: python -m unittest test_gemini_fallback test_groq_retry -v
      - name: Simulate Groq 429 and call Gemini with structured output
        env:
          GROQ_API_KEY: simulated-not-sent
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u gemini_fallback_check.py
