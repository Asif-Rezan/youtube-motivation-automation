name: Reference storybook thumbnail preview
on:
  workflow_dispatch:
    inputs:
      strength:
        description: Image-to-image denoising strength (0 < value <= 1)
        type: string
        default: '0.50'
        required: true
permissions:
  contents: read
jobs:
  thumbnail:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '4'
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CPU_IMAGE_WIDTH: '1024'
      CPU_IMAGE_HEIGHT: '576'
      CPU_IMAGE_STEPS: '20'
      THUMBNAIL_DENOISE_STRENGTH: ${{ inputs.strength }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU image runtime
        run: |
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-images-cpu.txt
      - name: Generate production reference-guided thumbnail
        run: python -u demos/thumbnail-reference/preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-storybook-thumbnail-preview
          path: output/thumbnail-reference-preview/
          if-no-files-found: error
          retention-days: 7
