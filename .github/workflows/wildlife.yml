name: Wildlife simulation video
on:
  push:
    branches: [codex/wildlife-simulation]
    paths:
      - 'wildlife/**'
      - 'assets/wildlife/**'
      - requirements-wildlife.txt
      - .github/workflows/wildlife.yml
  workflow_dispatch:
    inputs:
      episode:
        description: Episode from the wildlife catalog
        type: choice
        options: [goat-island]
        default: goat-island
      preview:
        description: Render the 30-second cut
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EPISODE: ${{ inputs.episode || 'goat-island' }}
      PREVIEW: ${{ github.event_name == 'push' || inputs.preview }}
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-wildlife.txt
      - name: Install speech and rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-wildlife.txt
      - name: Render the wildlife video and thumbnail
        shell: bash
        run: |
          args=(--episode "$EPISODE")
          if [[ "$PREVIEW" == true ]]; then args+=(--preview); fi
          python -u -m wildlife.render "${args[@]}"
      - name: Save video, thumbnail and timeline
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-${{ inputs.episode || 'goat-island' }}
          path: |
            output/wildlife/video.mp4
            output/wildlife/thumbnail.jpg
            output/wildlife/episode.json
          if-no-files-found: error
          retention-days: 14
