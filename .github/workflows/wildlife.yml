name: Wildlife simulation video
on:
  push:
    branches: [main]
    paths: [.generation/wildlife-full-request.txt]
  schedule:
    - cron: '0 21 * * *' # 03:00 Asia/Dhaka, next day
  workflow_dispatch:
    inputs:
      episode:
        description: Select the wildlife episode
        type: choice
        options: [auto, goat-island]
        default: auto
      preview:
        description: Render a 30-second preview
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: dudi-dam-tv-publish
  cancel-in-progress: false
env:
  EPISODE: ${{ inputs.episode || 'auto' }}
  PREVIEW: ${{ inputs.preview || false }}
  HF_HUB_DISABLE_XET: '1'
  OMP_NUM_THREADS: '2'
jobs:
  prepare:
    name: Generate new wildlife idea, script and SEO metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      scenes: ${{ steps.plan.outputs.scenes }}
      next: ${{ steps.plan.outputs.next }}
      episode: ${{ steps.plan.outputs.episode }}
      topic: ${{ steps.plan.outputs.topic }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install the Qwen CPU runtime
        if: inputs.preview != true && env.EPISODE == 'auto'
        run: pip install -r requirements-lyrics.txt
      - name: Select episode and generate the validated plan
        id: plan
        shell: bash
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          episode="$EPISODE"
          next=render
          topic_args=()
          if [[ "$GITHUB_EVENT_NAME" == push && "$episode" == auto ]] &&
             grep -qx 'mode=fresh' .generation/wildlife-full-request.txt; then
            episode="auto-$(TZ=Asia/Dhaka date +%F)-$GITHUB_RUN_ID"
            if grep -qx 'topic=tides' .generation/wildlife-full-request.txt; then
              topic_args+=(--topic tides)
            fi
          fi
          mkdir -p output/wildlife-plan
          if [[ "$PREVIEW" == true ]]; then
            episode=goat-island
            echo null > output/wildlife-plan/plan.json
          else
            selected=$(python -u -m wildlife.publication select --episode "$episode" "${topic_args[@]}" | tee /dev/stderr | tail -n1)
            episode=$(jq -er '.episode' <<< "$selected")
            next=$(jq -er '.next' <<< "$selected")
          fi
          echo "episode=$episode" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [[ "$next" == render ]]; then
            topic=$(jq -r '.idea.topic // ""' output/wildlife-plan/plan.json)
            echo "topic=$topic" >> "$GITHUB_OUTPUT"
            args=(--episode "$episode" --manifest output/wildlife-plan/plan.json)
            if [[ "$PREVIEW" == true ]]; then args+=(--preview); fi
            scenes=$(python -u -m wildlife.render "${args[@]}" --stage plan)
            echo "scenes=$scenes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.next == 'render'
        with:
          name: wildlife-plan
          path: output/wildlife-plan/plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Download and verify Blender for all tidal render jobs
        if: steps.plan.outputs.topic == 'tides'
        run: bash scripts/install-wildlife-blender.sh download output/wildlife-blender
      - name: Share the verified Blender archive
        if: steps.plan.outputs.topic == 'tides'
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-blender
          path: output/wildlife-blender/*.tar.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  audio:
    name: Generate and master narration
    needs: prepare
    if: needs.prepare.outputs.next == 'render'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EPISODE: ${{ needs.prepare.outputs.episode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-wildlife.txt
            requirements-wildlife-render.txt
      - name: Install CPU narration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-wildlife.txt
      - uses: actions/download-artifact@v4
        with:
          name: wildlife-plan
          path: output/wildlife-plan
      - shell: bash
        run: |
          args=(--episode "$EPISODE" --manifest output/wildlife-plan/plan.json)
          if [[ "$PREVIEW" == true ]]; then args+=(--preview); fi
          python -u -m wildlife.render "${args[@]}" --stage audio
      - uses: actions/upload-artifact@v4
        with:
          name: wildlife-narration
          path: output/wildlife-parts/voice-*.wav
          if-no-files-found: error
          retention-days: 7
  scenes:
    name: Generate visuals · scene ${{ matrix.scene }}
    needs: prepare
    if: needs.prepare.outputs.next == 'render'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        scene: ${{ fromJSON(needs.prepare.outputs.scenes || '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EPISODE: ${{ needs.prepare.outputs.episode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          pip install -r requirements-wildlife-render.txt
      - uses: actions/download-artifact@v4
        with:
          name: wildlife-plan
          path: output/wildlife-plan
      - name: Install scene illustration dependencies
        if: startsWith(needs.prepare.outputs.episode, 'auto-')
        run: |
          pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-images-cpu.txt
      - name: Download the shared Blender archive
        if: needs.prepare.outputs.topic == 'tides'
        uses: actions/download-artifact@v4
        with:
          name: wildlife-blender
          path: output/wildlife-blender
      - name: Verify and install headless Blender
        if: needs.prepare.outputs.topic == 'tides'
        run: bash scripts/install-wildlife-blender.sh install output/wildlife-blender
      - shell: bash
        env:
          SCENE_INDEX: ${{ matrix.scene }}
        run: |
          args=(--episode "$EPISODE" --manifest output/wildlife-plan/plan.json)
          if [[ "$PREVIEW" == true ]]; then args+=(--preview); fi
          if [[ "$EPISODE" == auto-* ]]; then args+=(--generate-art); fi
          python -u -m wildlife.render "${args[@]}" --stage scene --index "$SCENE_INDEX"
      - uses: actions/upload-artifact@v4
        with:
          name: wildlife-scene-${{ matrix.scene }}
          path: output/wildlife-parts/visual-*.mp4
          if-no-files-found: error
          retention-days: 7
  assemble:
    name: Assemble 4K video and draw 1080p thumbnail
    needs: [prepare, audio, scenes]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EPISODE: ${{ needs.prepare.outputs.episode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          pip install -r requirements-wildlife-render.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: wildlife-scene-*
          path: output/wildlife-parts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: wildlife-narration
          path: output/wildlife-parts
      - uses: actions/download-artifact@v4
        with:
          name: wildlife-plan
          path: output/wildlife-plan
      - name: Download the shared Blender archive
        if: needs.prepare.outputs.topic == 'tides'
        uses: actions/download-artifact@v4
        with:
          name: wildlife-blender
          path: output/wildlife-blender
      - name: Verify and install headless Blender
        if: needs.prepare.outputs.topic == 'tides'
        run: bash scripts/install-wildlife-blender.sh install output/wildlife-blender
      - shell: bash
        run: |
          args=(--episode "$EPISODE" --manifest output/wildlife-plan/plan.json)
          if [[ "$PREVIEW" == true ]]; then args+=(--preview); fi
          python -u -m wildlife.render "${args[@]}" --stage assemble
          jq -r '"## " + .title + "\n\n" + .description + "\n\n**Tags** " + (.tags | join(", "))' output/wildlife/metadata.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wildlife-${{ needs.prepare.outputs.episode }}
          path: output/wildlife/
          if-no-files-found: error
          retention-days: 14
  youtube:
    name: Back up to Drive and publish to YouTube
    needs: [prepare, assemble]
    if: inputs.preview != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EPISODE: ${{ needs.prepare.outputs.episode }}
      UPLOAD_MODE: public
      VIDEO_CATEGORY_ID: '27'
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCztvMrNCT34DO3DtzLPgWaw' }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if ! command -v ffprobe; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: wildlife-${{ needs.prepare.outputs.episode }}
          path: output/wildlife
      - run: python -u -m wildlife.publication youtube --episode "$EPISODE"
  facebook:
    name: Publish and verify on Facebook
    needs: [prepare, youtube]
    if: always() && !cancelled() && (needs.youtube.result == 'success' || needs.prepare.outputs.next == 'facebook')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EPISODE: ${{ needs.prepare.outputs.episode }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u -m wildlife.publication facebook --episode "$EPISODE"
  cleanup:
    name: Clean verified media from Drive
    needs: [prepare, facebook]
    if: always() && !cancelled() && (needs.facebook.result == 'success' || needs.prepare.outputs.next == 'cleanup')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: dudi-drive-cleanup
      cancel-in-progress: false
    env:
      EPISODE: ${{ needs.prepare.outputs.episode }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCztvMrNCT34DO3DtzLPgWaw' }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u -m wildlife.publication cleanup --episode "$EPISODE"
