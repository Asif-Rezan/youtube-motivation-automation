name: Local text grammar and inference regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qwen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEXT_BACKEND: qwen-local
      STORY_MODEL: Qwen/Qwen3-4B-Instruct-2507
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-story.txt
      - run: python -m unittest test_story_cpu test_human_history test_video_metadata -v
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/huggingface/hub/models--unsloth--Qwen3-4B-Instruct-2507-GGUF
          key: qwen3-4b-instruct2507-q4km-a06e946bb6b655725eafa393f4a9745d460374c9
      - name: Exercise actual production thumbnail grammar on real Qwen
        run: python -u qwen_check.py
