name: Cover music listening preview
on:
  push:
    branches: [demo/cover-music-preview]
    paths: [.generation/cover-preview-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dudi-cover-listening-preview
  cancel-in-progress: false
jobs:
  cover-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ACESTEP_SOURCE_DIR: ${{ github.workspace }}/.vendor/ace-step
      ACESTEP_CHECKPOINTS_DIR: .models/acestep
      ACESTEP_INIT_LLM: 'false'
      ACESTEP_GENERATION_TIMEOUT: '6000'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ace-step/ACE-Step-1.5
          ref: ca1e85fe9430179831e6bc6be790c332190a3866
          path: .vendor/ace-step
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Prepare CPU memory and audio tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          sudo fallocate -l 16G /swapfile-cover
          sudo chmod 600 /swapfile-cover
          sudo mkswap /swapfile-cover
          sudo swapon /swapfile-cover
      - name: Install pinned CPU music runtime
        run: |
          pip install --no-cache-dir torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-music-cpu.txt
      - name: Generate 30-second cover with source audio and 50 percent strength
        run: python -u demos/cover-music/render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cover-music-strength-50-${{ github.run_id }}
          path: |
            output/cover-music-preview/cover-strength-50.mp3
            output/cover-music-preview/settings.json
            output/cover-music-preview/generated/*.wav
          retention-days: 7
          if-no-files-found: warn
