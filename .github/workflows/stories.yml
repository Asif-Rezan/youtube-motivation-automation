name: Daily Hindi emotional motivational story
'on':
  workflow_dispatch:
    inputs:
      run_id:
        description: Stable story ID; reuse to resume. Empty uses the Dhaka date.
        required: false
        type: string
      prepared_run:
        description: Previous STORY workflow run number to resume (not a kids run)
        required: false
        type: string
      upload_mode:
        description: Preserve automatic 72h buffer and New York 6AM release
        type: choice
        default: scheduled
        options:
        - scheduled
        - public
      publish_at:
        description: Optional future ISO timestamp with timezone; empty keeps automatic policy
        required: false
        type: string
  schedule:
  - cron: 0 21 * * *
permissions:
  contents: read
  actions: read
concurrency:
  group: daily-hindi-story-publish
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      LYRICS_MODEL: Qwen/Qwen3-4B-Instruct-2507
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - id: identity
      env:
        REQUESTED_RUN_ID: ${{ inputs.run_id }}
      run: |-
        RUN_ID="${REQUESTED_RUN_ID:-story-$(TZ=Asia/Dhaka date +%F)}"
        [[ "$RUN_ID" =~ ^[a-zA-Z0-9_-]{1,80}$ ]] || exit 1
        echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
    - name: Validate existing YouTube and Drive configuration
      env:
        YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCztvMrNCT34DO3DtzLPgWaw' }}
        DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
      run: python validate_publication_config.py
    - run: pip install -r requirements.txt -r requirements-lyrics.txt
    - name: Restore previous story checkpoints
      if: inputs.prepared_run != ''
      uses: actions/download-artifact@v4
      with:
        pattern: story-*
        merge-multiple: true
        run-id: ${{ inputs.prepared_run }}
        github-token: ${{ github.token }}
        path: output/
    - name: Write and reserve a fresh Hindi emotional story
      env:
        YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCztvMrNCT34DO3DtzLPgWaw' }}
        DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        STORY_RUN_ID: ${{ steps.identity.outputs.run_id }}
      run: python -u daily_story.py --run-id "$STORY_RUN_ID" --stage plan --check-history
    - uses: actions/upload-artifact@v4
      with:
        name: story-input-${{ github.run_id }}
        path: output/
        retention-days: 7
      if: always()
  voice:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      STORY_RUN_ID: ${{ needs.plan.outputs.run_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: |-
        sudo apt-get update
        sudo apt-get install -y espeak-ng libsndfile1 ffmpeg
        pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt -r requirements-voice-cpu.txt
    - uses: actions/download-artifact@v4
      with:
        name: story-input-${{ github.run_id }}
        path: output/
    - name: Speak the complete Hindi script and measure 8-12 minute timeline
      run: python -u daily_story.py --run-id "$STORY_RUN_ID" --stage voice
    - uses: actions/upload-artifact@v4
      with:
        name: story-voice-${{ github.run_id }}
        path: output/
        retention-days: 7
      if: always()
  music:
    needs:
    - plan
    - voice
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      ACESTEP_SOURCE_DIR: ${{ github.workspace }}/.vendor/ace-step
      ACESTEP_CHECKPOINTS_DIR: .models/acestep
      ACESTEP_INIT_LLM: 'false'
      ACESTEP_GENERATION_TIMEOUT: '18000'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      STORY_RUN_ID: ${{ needs.plan.outputs.run_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: ace-step/ACE-Step-1.5
        ref: ca1e85fe9430179831e6bc6be790c332190a3866
        path: .vendor/ace-step
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Prepare CPU runner memory and audio tools
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1
        sudo fallocate -l 16G /swapfile-music
        sudo chmod 600 /swapfile-music
        sudo mkswap /swapfile-music
        sudo swapon /swapfile-music
        free -h
        df -h .
    - name: Install CPU-only music inference runtime
      run: |
        pip install --no-cache-dir torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
        pip install --no-cache-dir -r requirements.txt -r requirements-music-cpu.txt
    - name: Verify pinned ACE-Step CPU imports
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        from music_cpu import runtime
        torch, handler, params, config, infer = runtime(Path(os.environ['ACESTEP_SOURCE_DIR']))
        assert not torch.cuda.is_available()
        print('Pinned ACE-Step CPU runtime imported successfully')
        PY
    - uses: actions/download-artifact@v4
      with:
        name: story-voice-${{ github.run_id }}
        path: output/
    - name: Generate instrumental ACE-Step score and duck it under narration
      run: python -u daily_story.py --run-id "$STORY_RUN_ID" --stage music
    - uses: actions/upload-artifact@v4
      with:
        name: story-music-${{ github.run_id }}
        path: |-
          output/*/*.json
          output/*/*.wav
          output/*/score/
        retention-days: 7
      if: always()
  images:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    env:
      IMAGE_SHARD: ${{ matrix.shard }}
      IMAGE_SHARDS: '8'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CPU_IMAGE_WIDTH: '1024'
      CPU_IMAGE_HEIGHT: '576'
      CPU_IMAGE_STEPS: '20'
      STORY_RUN_ID: ${{ needs.plan.outputs.run_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Prepare CPU image memory
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo fallocate -l 12G /swapfile-images
        sudo chmod 600 /swapfile-images
        sudo mkswap /swapfile-images
        sudo swapon /swapfile-images
    - name: Install reference SSD-1B CPU image runtime
      run: |
        pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
        pip install --no-cache-dir -r requirements.txt -r requirements-images-cpu.txt
    - uses: actions/download-artifact@v4
      with:
        name: story-input-${{ github.run_id }}
        path: output/
    - name: Generate matching 3D storybook scenes with reference SSD-1B style
      run: python -u daily_story.py --run-id "$STORY_RUN_ID" --stage images
    - uses: actions/upload-artifact@v4
      with:
        name: story-images-${{ github.run_id }}-${{ matrix.shard }}
        path: |-
          output/*/scene-*-source.png
          output/*/image-manifest-*.json
        retention-days: 7
      if: always()
  publish:
    needs:
    - plan
    - music
    - images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID || vars.EXPECTED_CHANNEL_ID || 'UCztvMrNCT34DO3DtzLPgWaw' }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      STORY_RUN_ID: ${{ needs.plan.outputs.run_id }}
      UPLOAD_MODE: ${{ inputs.upload_mode || 'scheduled' }}
      PUBLISH_AT: ${{ inputs.publish_at }}
      VIDEO_LANGUAGE: hi
      AUDIO_LANGUAGE: hi
      VIDEO_CATEGORY_ID: '27'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: |-
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install -r requirements.txt
    - uses: actions/download-artifact@v4
      with:
        name: story-music-${{ github.run_id }}
        path: output/
    - uses: actions/download-artifact@v4
      with:
        pattern: story-images-${{ github.run_id }}-*
        merge-multiple: true
        path: output/
    - name: Render measured narration scenes into an 8-12 minute video
      run: python -u daily_story.py --run-id "$STORY_RUN_ID" --stage render
    - uses: actions/upload-artifact@v4
      with:
        name: story-video-${{ github.run_id }}
        path: |-
          output/*/video.mp4
          output/*/thumbnail.jpg
          output/*/*.json
        retention-days: 7
    - name: Back up and schedule on the existing YouTube channel
      if: vars.PUBLISH_ENABLED == 'true'
      run: python -u daily_story.py --run-id "$STORY_RUN_ID" --stage publish
    - uses: actions/upload-artifact@v4
      with:
        name: story-publication-${{ github.run_id }}
        path: output/*/*.json
        retention-days: 7
      if: always()
