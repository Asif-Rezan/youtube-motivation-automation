# Example only. Do not rename to render.yaml or deploy until the complete private
# video test passes and billable cron usage is approved.
services:
  - type: cron
    name: youtube-motivation-daily
    runtime: docker
    schedule: "0 3 * * *"
    dockerCommand: python workflow.py daily
    envVars:
      - key: DAILY_ENABLED
        value: "false"
      - key: UPLOAD_ENABLED
        value: "false"
      - key: TEXT_BACKEND
        value: qwen-local
      - key: STORY_MODEL
        value: Qwen/Qwen3-4B-Instruct-2507
      - key: HF_TOKEN
        sync: false
      - key: IMAGE_MODEL
        sync: false
      - key: YOUTUBE_TOKEN_JSON
        sync: false
      - key: EXPECTED_CHANNEL_ID
        sync: false
      - key: DRIVE_TOKEN_JSON
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
